name: Build Zhisitu APK
on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装Java17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 安装Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 初始化并安装依赖（自动生成lock文件）
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "智思图" zhisitu.app --web-dir=.
          npx cap add android
          npx cap sync

      - name: 编译APK
        run: |
          cd android
          ./gradlew assembleRelease

      - name: 上传APK
        uses: actions/upload-artifact@v4
        with:
          name: 智思图-APK安装包
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
