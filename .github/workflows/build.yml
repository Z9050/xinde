name: Build Zhisitu APK
on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'none'

      - name: Install Capacitor and generate lock file
        run: |
          npm init -y
          npm install --force @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "智思图" zhisitu.app --web-dir=.
          npx cap add android
          npx cap sync

      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 智思图-APK安装包
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
