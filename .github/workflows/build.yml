name: 智思图 打包APK
on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装Web2Apk打包工具
        run: sudo apt update && sudo apt install -y wget unzip

      - name: 下载并打包网页为APK
        run: |
          wget https://github.com/kiodev/web2apk/releases/download/v1.0/web2apk-linux-x64.zip
          unzip web2apk-linux-x64.zip
          chmod +x web2apk
          ./web2apk -n "智思图" -p zhisitu.app -i main.html -o zhisitu.apk

      - name: 上传APK
        uses: actions/upload-artifact@v4
        with:
          name: 智思图-APK
          path: zhisitu.apk
